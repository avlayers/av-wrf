name: images

# Main publishes the solver image when an input baked into it changes.
# A pull request does not compile WRF. JOBS=8 matches the 8 vCPU builder.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'src/av_wrf/**'
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    # runs-on/action must stay the first step so Magic Cache serves type=gha.
    # Graviton defaults to x64 without image=ubuntu24-full-arm64.
    runs-on: >-
      runs-on=${{ github.run_id }}/family=c8g.2xlarge+c7g.2xlarge/cpu=8/image=ubuntu24-full-arm64/volume=120gb:gp3/spot=true/extras=s3-cache
    timeout-minutes: 90
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: av-wrf:runtime
          cache-from: type=gha,scope=runtime-arm64
          cache-to: type=gha,scope=runtime-arm64,mode=max
      - run: docker run --rm --network none av-wrf:runtime check
      - run: docker run --rm --network none --entrypoint dpkg-query av-wrf:runtime -W ca-certificates libzstd1
      - id: tags
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "av-wrf:solver"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              owner=${GITHUB_REPOSITORY_OWNER,,}
              echo "ghcr.io/${owner}/av-wrf-solver:main"
              echo "ghcr.io/${owner}/av-wrf-solver:sha-${GITHUB_SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: solver
          build-args: |
            JOBS=8
            WRF_PORTABLE_ISA=armv8.2-a
          load: true
          push: false
          tags: av-wrf:solver
          cache-from: type=gha,scope=solver-arm64
          cache-to: type=gha,scope=solver-arm64,mode=max
      - run: docker run --rm --network none av-wrf:solver check
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker/check-icon-grib.py,target=/check-icon-grib.py,readonly"
          av-wrf:solver /check-icon-grib.py --ungrib /opt/av-wrf/bin/ungrib.exe
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker/check-namelist.py,target=/check-namelist.py,readonly"
          av-wrf:solver /check-namelist.py
      - run: >-
          docker run --rm --network none --user 65534:65534 --entrypoint python
          --mount "type=bind,source=$PWD/docker,target=/checks,readonly"
          av-wrf:solver /checks/check-native.py /tmp/native-smoke
      - name: Publish the solver image
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "av-wrf:solver" ]] && continue
            docker tag av-wrf:solver "$tag"
            docker push "$tag"
          done <<<"$TAGS"
