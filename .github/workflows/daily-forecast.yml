name: daily-forecast

on:
  schedule:
    # Keep this at or after the configured product's schedule_cron_utc. The
    # resolver picks the latest cycle whose trigger has passed.
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Publish origin ISO UTC or YYYYMMDD/HH (default: latest due cycle)'
        required: false
        type: string
      product:
        description: 'Product id under config/products (default: AV_WRF_PRODUCT)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      product: ${{ steps.config.outputs.product }}
      cycle: ${{ steps.config.outputs.cycle }}
      runner: ${{ steps.config.outputs.runner }}
      committed: ${{ steps.recover.outputs.committed }}
      latest: ${{ steps.recover.outputs.latest }}
    env:
      PRODUCT: ${{ inputs.product || vars.AV_WRF_PRODUCT }}
      CYCLE_INPUT: ${{ inputs.cycle }}
      AV_WRF_RUNNER: ${{ vars.AV_WRF_RUNNER }}
      AV_WRF_STORE_URI: ${{ secrets.AV_WRF_STORE_URI }}
      AV_WRF_S3_ENDPOINT: ${{ vars.AV_WRF_S3_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked

      - name: Validate configuration and resolve cycle
        id: config
        run: |
          set -euo pipefail
          : "${PRODUCT:?Set repository variable AV_WRF_PRODUCT or pass the product input}"
          : "${AV_WRF_RUNNER:?Set AV_WRF_RUNNER to a trusted Linux arm64 self-hosted runner label}"
          : "${AV_WRF_STORE_URI:?Set AV_WRF_STORE_URI to a durable s3:// destination}"
          case "$AV_WRF_STORE_URI" in
            s3://*) ;;
            *) echo "::error::AV_WRF_STORE_URI must be s3:// for production runs"; exit 1 ;;
          esac
          if [[ -n "$CYCLE_INPUT" ]]; then
            cycle=$(uv run python -m scripts.latest_cycle --product "$PRODUCT" --cycle "$CYCLE_INPUT")
          else
            cycle=$(uv run python -m scripts.latest_cycle --product "$PRODUCT")
          fi
          {
            echo "product=$PRODUCT"
            echo "cycle=$cycle"
            echo "runner=$AV_WRF_RUNNER"
          } >> "$GITHUB_OUTPUT"
          printf 'CYCLE=%s\n' "$cycle" >> "$GITHUB_ENV"
          printf 'Resolved %s %s\n' "$PRODUCT" "$cycle"

      - name: Recover a committed cycle before expensive work
        id: recover
        run: |
          set -euo pipefail
          json=$(uv run av-wrf recover --product "$PRODUCT" --cycle "$CYCLE" --probe)
          status=$(printf '%s' "$json" | jq -er .status)
          if [[ "$status" == "absent" ]]; then
            {
              echo "committed=false"
              echo "latest="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(printf '%s' "$json" | jq -er '.latest[0]')
          if [[ "$latest" != "advanced" && "$latest" != "current" ]]; then
            echo "::error::Committed cycle $CYCLE is not live ($latest); no forecast or notification will run"
            exit 1
          fi
          {
            echo "committed=true"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

  forecast:
    needs: preflight
    if: needs.preflight.outputs.committed != 'true'
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    outputs:
      latest: ${{ steps.publish.outputs.latest || steps.recover.outputs.latest }}
    env:
      PRODUCT: ${{ needs.preflight.outputs.product }}
      CYCLE: ${{ needs.preflight.outputs.cycle }}
      SCRATCH: ${{ github.workspace }}/scratch
      GEOG_DIR: ${{ github.workspace }}/geog
      GEOG_TAR: ${{ github.workspace }}/geog_high_res_mandatory.tar.gz
      GEOG_LAKE_TAR: ${{ github.workspace }}/lake_depth.tar.bz2
      GEOG_URL: https://www2.mmm.ucar.edu/wrf/src/wps_files/geog_high_res_mandatory.tar.gz
      GEOG_LAKE_URL: https://www2.mmm.ucar.edu/wrf/src/wps_files/lake_depth.tar.bz2
      AV_WRF_STAGE_STORE_URI: file:///scratch/stage-store
      AV_WRF_STORE_URI: ${{ secrets.AV_WRF_STORE_URI }}
      AV_WRF_S3_ENDPOINT: ${{ vars.AV_WRF_S3_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AV_WRF_MPI_RANKS: ${{ vars.AV_WRF_MPI_RANKS || '4' }}
      AV_WRF_NATIVE_TIMEOUT_S: ${{ vars.AV_WRF_NATIVE_TIMEOUT_S }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked

      - name: Recover committed cycle
        id: recover
        run: |
          set -euo pipefail
          json=$(uv run av-wrf recover --product "$PRODUCT" --cycle "$CYCLE" --probe)
          status=$(printf '%s' "$json" | jq -er .status)
          if [[ "$status" == "absent" ]]; then
            attempt="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            {
              echo "recovered=false"
              echo "attempt=$attempt"
            } >> "$GITHUB_OUTPUT"
            printf 'ATTEMPT=%s\n' "$attempt" >> "$GITHUB_ENV"
            exit 0
          fi
          latest=$(printf '%s' "$json" | jq -er '.latest[0]')
          if [[ "$latest" != "advanced" && "$latest" != "current" ]]; then
            echo "::error::Committed cycle $CYCLE is not live ($latest); no forecast or notification will run"
            exit 1
          fi
          {
            echo "recovered=true"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Validate cycle freshness
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          uv run python -m scripts.latest_cycle --product "$PRODUCT" --cycle "$CYCLE" >/dev/null

      - name: Validate forecast worker
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Linux" ]] || { echo "::error::Linux is required"; exit 1; }
          [[ "$(uname -m)" == "aarch64" ]] || {
            echo "::error::arm64 is required for the solver-arm64 image and BuildKit cache"
            exit 1
          }
          command -v docker >/dev/null || { echo "::error::docker is required"; exit 1; }
          docker info >/dev/null || { echo "::error::docker daemon is unavailable"; exit 1; }
          for tool in curl tar gzip bzip2 jq awk df; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is required"; exit 1; }
          done
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( available_kb < 80 * 1024 * 1024 )); then
            echo "::error::Need at least 80 GiB free before downloading geography."
            echo "::error::Set AV_WRF_RUNNER to a larger worker with sufficient disk."
            exit 1
          fi
          mkdir -p "$SCRATCH"

      - name: Restore WPS geography archives
        id: geog-cache
        if: steps.recover.outputs.recovered != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.GEOG_TAR }}
            ${{ env.GEOG_LAKE_TAR }}
          key: wps-geog-high-res-v1

      - name: Download WPS geography archives
        if: steps.recover.outputs.recovered != 'true' && steps.geog-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$GEOG_TAR.part" "$GEOG_URL"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$GEOG_LAKE_TAR.part" "$GEOG_LAKE_URL"
          mv "$GEOG_TAR.part" "$GEOG_TAR"
          mv "$GEOG_LAKE_TAR.part" "$GEOG_LAKE_TAR"
          ls -lh "$GEOG_TAR" "$GEOG_LAKE_TAR"

      - name: Extract WPS geography
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GEOG_DIR"
          mkdir -p "$GEOG_DIR"
          tar -xzf "$GEOG_TAR" -C "$GEOG_DIR" --strip-components=1
          tar -xjf "$GEOG_LAKE_TAR" -C "$GEOG_DIR"
          test -d "$GEOG_DIR/topo_gmted2010_30s"
          test -d "$GEOG_DIR/lake_depth"
          du -sh "$GEOG_DIR"

      - name: Check remaining disk after geography extraction
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if (( available_kb < 40 * 1024 * 1024 )); then
            echo "::error::Need at least 40 GiB free after extraction for image, scratch, and store."
            exit 1
          fi

      - name: Save WPS geography archives
        if: steps.recover.outputs.recovered != 'true' && steps.geog-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.GEOG_TAR }}
            ${{ env.GEOG_LAKE_TAR }}
          key: ${{ steps.geog-cache.outputs.cache-primary-key }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.recover.outputs.recovered != 'true'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.recover.outputs.recovered != 'true'
        with:
          context: .
          file: docker/Dockerfile
          target: solver
          build-args: JOBS=2
          load: true
          tags: av-wrf:solver
          cache-from: type=gha,scope=solver-arm64
          cache-to: type=gha,scope=solver-arm64,mode=max

      - name: Bind solver image digest
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          # A --load build has no registry RepoDigest; bind its content-addressed
          # image ID as the pinned OCI identity recorded in the RunLock.
          digest=$(docker inspect --format '{{.Id}}' av-wrf:solver)
          printf 'AV_WRF_OCI_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Build static geography
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          geog_work_host="$SCRATCH/geog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          geog_work="/scratch/geog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$geog_work_host"
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-geog" \
            "$SCRATCH/geog.out" \
            --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AV_WRF_NATIVE_TIMEOUT_S="$AV_WRF_NATIVE_TIMEOUT_S" \
            -v "$GEOG_DIR:/opt/av-wrf/geog:ro" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver geog --product "$PRODUCT" --work-dir "$geog_work"

      - name: Parse geography
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          json=$(grep -E '^\{.*\}$' "$SCRATCH/geog.out" | tail -n 1)
          geo_em=$(printf '%s' "$json" | jq -er .geo_em)
          printf 'GEOG_FILE=%s\n' "$geo_em" >> "$GITHUB_ENV"

      - name: Plan cycle
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-plan" \
            "$SCRATCH/plan.out" \
            --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AV_WRF_STAGE_STORE_URI="$AV_WRF_STAGE_STORE_URI" \
            -e AV_WRF_OCI_DIGEST="$AV_WRF_OCI_DIGEST" \
            -e AV_WRF_MPI_RANKS="$AV_WRF_MPI_RANKS" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver plan --product "$PRODUCT" --cycle "$CYCLE" --attempt "$ATTEMPT" \
              --geog-file "$GEOG_FILE"

      - name: Parse plan
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          json=$(grep -E '^\{.*\}$' "$SCRATCH/plan.out" | tail -n 1)
          cycle_partition=$(printf '%s' "$json" | jq -er .cycle_partition)
          printf 'CYCLE_PARTITION=%s\n' "$cycle_partition" >> "$GITHUB_ENV"

      - name: Acquire forcing
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-acquire" \
            "$SCRATCH/acquire.out" \
            --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AV_WRF_STAGE_STORE_URI="$AV_WRF_STAGE_STORE_URI" \
            -e AV_WRF_MPI_RANKS="$AV_WRF_MPI_RANKS" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver acquire --product "$PRODUCT" --cycle "$CYCLE" --attempt "$ATTEMPT" \
              --grib-dir /scratch/grib --cache /scratch/icon-cache --workers 8

      - name: Validate forcing
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          grep -E '^\{.*\}$' "$SCRATCH/acquire.out" | tail -n 1 | jq -e .

      - name: Recheck cycle before solve
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          uv run python -m scripts.latest_cycle --product "$PRODUCT" --cycle "$CYCLE" >/dev/null

      - name: Solve
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-solve" \
            "$SCRATCH/solve.out" \
            --rm --network none \
            --user "$(id -u):$(id -g)" \
            --shm-size=2g \
            -e HOME=/tmp \
            -e AV_WRF_STAGE_STORE_URI="$AV_WRF_STAGE_STORE_URI" \
            -e AV_WRF_OCI_DIGEST="$AV_WRF_OCI_DIGEST" \
            -e AV_WRF_MPI_RANKS="$AV_WRF_MPI_RANKS" \
            -e AV_WRF_NATIVE_TIMEOUT_S="$AV_WRF_NATIVE_TIMEOUT_S" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver solve --product "$PRODUCT" --cycle "$CYCLE" --attempt "$ATTEMPT" \
              --work-dir /scratch/solve --grib-dir /scratch/grib --geog-file "$GEOG_FILE"

      - name: Validate solve
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          grep -E '^\{.*\}$' "$SCRATCH/solve.out" | tail -n 1 | jq -e .

      - name: Stage Zarr frames
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          cycle_dir=${CYCLE_PARTITION//\//_}
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-post" \
            "$SCRATCH/post.out" \
            --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AV_WRF_STAGE_STORE_URI="$AV_WRF_STAGE_STORE_URI" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver post --product "$PRODUCT" --cycle "$CYCLE" --attempt "$ATTEMPT" \
              --wrfout-dir "/scratch/solve/$PRODUCT/$cycle_dir/$ATTEMPT"

      - name: Validate post
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          grep -E '^\{.*\}$' "$SCRATCH/post.out" | tail -n 1 | jq -e .

      - name: Publish cycle
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          exec bash scripts/run-container.sh \
            "av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish" \
            "$SCRATCH/publish.out" \
            --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e AV_WRF_STAGE_STORE_URI="$AV_WRF_STAGE_STORE_URI" \
            -e AV_WRF_STORE_URI="$AV_WRF_STORE_URI" \
            -e AV_WRF_S3_ENDPOINT="$AV_WRF_S3_ENDPOINT" \
            -e AWS_REGION="$AWS_REGION" \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -v "$SCRATCH:/scratch" \
            av-wrf:solver publish --product "$PRODUCT" --cycle "$CYCLE" --attempt "$ATTEMPT"

      - name: Gate publish
        id: publish
        if: steps.recover.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          json=$(grep -E '^\{.*\}$' "$SCRATCH/publish.out" | tail -n 1)
          if ! printf '%s' "$json" | jq -e '
            .status == "published"
            and .destinations == 1
            and (.latest | type == "array")
            and (.latest | length == 1)
            and (.latest[0] == "advanced" or .latest[0] == "current")
          ' >/dev/null; then
            outcome=$(printf '%s' "$json" | jq -r '.latest // "missing"' 2>/dev/null || echo missing)
            echo "::error::Publication did not advance or confirm the live pointer: $outcome"
            exit 1
          fi
          latest=$(printf '%s' "$json" | jq -er '.latest[0]')
          printf 'LATEST=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      - name: Clean up forecast containers
        if: always()
        run: |
          set -euo pipefail
          command -v docker >/dev/null || exit 0
          ids=$(docker ps -aq --filter "name=av-wrf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-" || true)
          if [[ -n "$ids" ]]; then docker rm -f $ids >/dev/null 2>&1 || true; fi

      - name: Upload forecast logs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forecast-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SCRATCH }}/*.out
            ${{ env.SCRATCH }}/**/*.log
            ${{ env.SCRATCH }}/**/rsl.*
            ${{ env.SCRATCH }}/**/namelist.*
            ${{ env.SCRATCH }}/**/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  notify:
    needs: [preflight, forecast]
    if: |
      always()
      && needs.preflight.outputs.product != ''
      && needs.preflight.outputs.cycle != ''
      && (needs.forecast.result == 'success' || needs.preflight.outputs.committed == 'true')
      && (needs.forecast.outputs.latest == 'advanced' || needs.forecast.outputs.latest == 'current'
          || needs.preflight.outputs.latest == 'advanced' || needs.preflight.outputs.latest == 'current')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PRODUCT: ${{ needs.preflight.outputs.product }}
      CYCLE: ${{ needs.preflight.outputs.cycle }}
      AV_WRF_STORE_URI: ${{ secrets.AV_WRF_STORE_URI }}
      AV_WRF_S3_ENDPOINT: ${{ vars.AV_WRF_S3_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AV_WRF_WEBHOOK_URL: ${{ secrets.AV_WRF_WEBHOOK_URL }}
      AV_WRF_WEBHOOK_TOKEN: ${{ secrets.AV_WRF_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --locked

      - name: Reconcile consumer webhook
        if: env.AV_WRF_WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          json=$(uv run av-wrf reconcile --product "$PRODUCT" --cycle "$CYCLE")
          printf '%s' "$json" | jq -e '.status == "reconciled"'
